<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="expense.css">
    <title>Document</title>
</head>
<body>
        <div class="nav-button">
            <button id="premiummembership">Buy Premium</button>
            <button id="logout">Logout</button>
        </div>    
        <form id="submitform">
            <label for="amount">Choose expense amount:</label><input type="number" id="amount" name="amount"/>
            <label for="description">Choose description:</label><textarea placeholder="Enter your description" rows="5"
            cols="40" id="description" name="description"></textarea>
            <button type="submit" id="expenseaddition">Add Expense</button>
        </form> 
        <label id="leader">You are a premium user</label> <button type="click" id="leaderboard">Show Leaderboard</button>
        <h2>Expense</h2>
        <label for="dynamicpage">Expense per page</label><select id="dynamicpage"><option  value="2">2</option><option value="5" selected>5</option><option value="8">8</option></select>
        <ul id="list"></ul> 
        <div id="pagination"></div>

        <div id="premium"></div>
        <script src="expense.js"></script>
        <script>
            document.getElementById("premiummembership").addEventListener("click", () => {
                window.location.href = "../payment/index.html";
            });

            document.getElementById("logout").addEventListener("click", () => {
                localStorage.removeItem("token");
                window.location.href = "../Login/login.html";
            });
        </script>
</body>
</html>
